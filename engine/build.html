<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../../auth.js"></script>
<title>Assignment Builder</title>
<link rel="icon" href="../../favicon.ico" sizes="any">
<style>
  :root { --ink: #111; --muted: #555; --line: #e3e3ea; --bg: #fff; --head: #f6f6f9; --plum: #8E2465; --blue: #2d70b3; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; padding: 18px 16px 6px; }
  h1 { font: 600 1.6rem Georgia, serif; margin: 0; }
  h2 { font: 600 1.05rem -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0 0 8px; }
  .sub { color: var(--muted); }
  a { color: var(--blue); }
  button { font: inherit; padding: 6px 12px; border: 1px solid var(--line); background: #fff; border-radius: 8px; cursor: pointer; }
  button:hover { border-color: #bbb; } button:disabled { opacity: .55; cursor: default; }
  button.pri { background: var(--plum); color: #fff; border-color: var(--plum); }
  input, select { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .cols { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; padding: 8px 16px 24px; }
  @media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; } .filters input { flex: 1; min-width: 160px; }
  .bank { max-height: 62vh; overflow: auto; border-top: 1px solid var(--line); }
  .q { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 9px 2px; border-bottom: 1px solid var(--line); align-items: center; }
  .q .t { font-weight: 600; } .q .m { color: var(--muted); font-size: .9em; } .q .b { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .field { display: grid; gap: 4px; margin-bottom: 10px; } .field label { font-weight: 600; } .field .h { color: var(--muted); font-size: .9em; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  ol.items { margin: 6px 0 12px; padding-left: 1.4rem; } ol.items li { padding: 6px 0; border-bottom: 1px solid var(--line); }
  ol.items .it { display: flex; gap: 6px; align-items: center; justify-content: space-between; } ol.items .it span { flex: 1; }
  ol.items button { padding: 2px 8px; }
  .empty { color: var(--muted); padding: 8px 0; }
  .msg { padding: 8px 12px; border-radius: 8px; margin: 8px 0; } .msg.ok { background: #e7f4e4; } .msg.bad { background: #fbebeb; color: #8a1c1c; }
  .link { display: flex; gap: 6px; } .link input { flex: 1; }
  table.mine { width: 100%; border-collapse: collapse; } table.mine td, table.mine th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; } table.mine th { color: var(--muted); font-weight: 600; }
  .topbar { min-height: 22px; }
</style>
</head>
<body>
<div class="topbar" data-an-chip></div>
<header>
  <h1>Assignment Builder</h1>
  <span class="sub">Choose questions from the bank, then save: you get the link for your students.</span>
  <a href="../">Class progress</a>
</header>
<div class="cols">
  <section class="card" aria-labelledby="bankH">
    <h2 id="bankH">The question bank</h2>
    <div class="filters">
      <input type="search" id="find" placeholder="Find by title, section or skill" aria-label="Find a question">
      <select id="sec" aria-label="Section"><option value="">Every section</option></select>
    </div>
    <div class="bank" id="bank"></div>
  </section>
  <section aria-label="Assignment">
    <div class="card">
      <h2 id="formH">New assignment</h2>
      <div class="field"><label for="title">Title</label><input id="title" placeholder="Modeling with Quadratic Functions"></div>
      <div class="row2">
        <div class="field"><label for="abbr">Abbreviation</label><input id="abbr" placeholder="2.4A"><span class="h">Its short name, used once.</span></div>
        <div class="field"><label for="due">Due</label><input id="due" type="datetime-local"></div>
      </div>
      <div class="field"><label>Questions</label><ol class="items" id="items"></ol></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="pri" id="save">Save</button><button id="clear">New</button></div>
      <div id="out" aria-live="polite"></div>
    </div>
    <div class="card" style="margin-top:16px">
      <h2>My assignments</h2>
      <div id="mine"><div class="empty">Loading…</div></div>
    </div>
  </section>
</div>
<!--BANK_JS-->
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var B = window.AN_BANK || {}, P = window.AN_QPLACE || {}, cur = { id: "", items: [] }, MINE = [];
  var SITE = location.href.replace(/teacher\/build\/.*$/, "");
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function sec(id) { return id.split("-")[0]; }
  function variants(id) { return (P[id] || []).map(function (p, i) { return { i: i, name: p[3] || "", copy: !!p[4] }; }).filter(function (v) { return !v.copy; }); }
  function label(it) { var d = B[it.q] || {}, v = (P[it.q] || [])[it.v || 0] || []; return (d.title || it.q) + (v[3] ? ": " + v[3] : ""); }
  function sorted() { return Object.keys(P).filter(function (id) { return B[id]; }).sort(function (a, b) { return a.localeCompare(b, undefined, { numeric: true }); }); }
  function canSave() { return !!(window.AN && AN.enabled && AN.user && AN.user.teacher); }
  function say(t, ok) { $("out").innerHTML = t ? "<div class=\"msg " + (ok ? "ok" : "bad") + "\">" + t + "</div>" : ""; }

  // ---- the bank
  var secs = {}; sorted().forEach(function (id) { secs[sec(id)] = 1; });
  Object.keys(secs).sort(function (a, b) { return a.localeCompare(b, undefined, { numeric: true }); }).forEach(function (s) { $("sec").insertAdjacentHTML("beforeend", "<option>" + esc(s) + "</option>"); });
  function drawBank() {
    var f = $("find").value.trim().toLowerCase(), s = $("sec").value, h = "";
    sorted().forEach(function (id) {
      var d = B[id], hay = (id + " " + d.title + " " + (d.skills || []).join(" ")).toLowerCase();
      if (s && sec(id) !== s) return; if (f && hay.indexOf(f) < 0) return;
      var vs = variants(id), pick = vs.length > 1 ? "<select data-v=\"" + esc(id) + "\" aria-label=\"Which exercise\">" + vs.map(function (v) { return "<option value=\"" + v.i + "\">" + esc(v.name) + "</option>"; }).join("") + "</select>" : "";
      h += "<div class=\"q\"><div><div class=\"t\">" + esc(d.title) + "</div><div class=\"m\">" + esc(sec(id)) + " · " + esc((d.skills || []).join(", ")) + "</div></div>" +
        "<div class=\"b\">" + pick + "<a href=\"" + SITE + "q/?id=" + encodeURIComponent(id) + "\" target=\"_blank\" rel=\"noopener\">Preview</a><button data-add=\"" + esc(id) + "\">Add</button></div></div>";
    });
    $("bank").innerHTML = h || "<div class=\"empty\">No question matches.</div>";
  }
  $("find").addEventListener("input", drawBank); $("sec").addEventListener("change", drawBank);
  $("bank").addEventListener("click", function (e) {
    var b = e.target.closest("[data-add]"); if (!b) return;
    var id = b.getAttribute("data-add"), sel = $("bank").querySelector("select[data-v=\"" + id + "\"]"), it = { q: id };
    if (sel && +sel.value) it.v = +sel.value;
    cur.items.push(it); drawItems(); say("");
  });

  // ---- the assignment being built
  function drawItems() {
    var L = cur.items;
    $("items").innerHTML = L.length ? L.map(function (it, i) {
      return "<li><div class=\"it\"><span>" + esc(label(it)) + "</span><button data-up=\"" + i + "\" aria-label=\"Move up\"" + (i ? "" : " disabled") + ">↑</button><button data-dn=\"" + i + "\" aria-label=\"Move down\"" + (i < L.length - 1 ? "" : " disabled") + ">↓</button><button data-rm=\"" + i + "\" aria-label=\"Remove\">✕</button></div></li>";
    }).join("") : "<div class=\"empty\">Add questions from the bank.</div>";
    $("formH").textContent = cur.id ? "Edit " + ($("abbr").value || "assignment") : "New assignment";
  }
  $("items").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return; var L = cur.items, i;
    if (b.hasAttribute("data-up")) { i = +b.getAttribute("data-up"); L.splice(i - 1, 0, L.splice(i, 1)[0]); }
    else if (b.hasAttribute("data-dn")) { i = +b.getAttribute("data-dn"); L.splice(i + 1, 0, L.splice(i, 1)[0]); }
    else if (b.hasAttribute("data-rm")) { L.splice(+b.getAttribute("data-rm"), 1); }
    drawItems();
  });
  function load(a) {
    cur = { id: a ? a.id : "", items: a ? (a.items || []).map(function (it) { return { q: it.q, v: it.v || 0 }; }) : [] };
    $("title").value = a ? a.title : ""; $("abbr").value = a ? a.abbr : ""; $("due").value = a && a.due && a.due.all ? a.due.all : "";
    drawItems(); say(a ? "Editing " + esc(a.abbr) + ". Save keeps the same link." : "", true);
  }
  $("clear").addEventListener("click", function () { load(null); });
  ["title", "abbr", "due"].forEach(function (id) { $(id).addEventListener("input", function () { if ($("out").querySelector(".bad")) say(""); }); });   // (an old message goes once the field is changed)
  function linkOf(id) { return SITE + "a/?id=" + encodeURIComponent(id); }
  $("save").addEventListener("click", function () {
    if (!canSave()) { say("Sign in as a teacher to save."); return; }
    var rec = { id: cur.id || undefined, title: $("title").value.trim(), abbr: $("abbr").value.trim(), due: $("due").value ? { all: $("due").value } : {}, items: cur.items };
    if (!rec.title) { say("Give the assignment a title."); return; } if (!rec.abbr) { say("Give the assignment an abbreviation (like 2.4A)."); return; } if (!rec.items.length) { say("Add at least one question."); return; }
    $("save").disabled = true; $("save").textContent = "Saving…";
    AN.api("saveAssignment", { assignment: rec }).then(function (j) {
      cur.id = j.assignment.id; drawItems();
      say("Saved. The link for your students:<div class=\"link\" style=\"margin-top:6px\"><input readonly value=\"" + esc(linkOf(cur.id)) + "\" aria-label=\"Student link\"><button id=\"cp\">Copy</button></div>", true);
      loadMine();
    }).catch(function (e) { say(esc(e.message || "Could not save.")); }).then(function () { $("save").disabled = false; $("save").textContent = "Save"; });
  });
  $("out").addEventListener("click", function (e) { if (e.target.id === "cp") { var i = $("out").querySelector("input"); i.select(); try { navigator.clipboard.writeText(i.value); } catch (er) { document.execCommand("copy"); } e.target.textContent = "Copied"; } });

  // ---- my assignments
  function drawMine() {
    if (!MINE.length) { $("mine").innerHTML = "<div class=\"empty\">None yet.</div>"; return; }
    $("mine").innerHTML = "<table class=\"mine\"><thead><tr><th>Abbr.</th><th>Title</th><th>Due</th><th></th></tr></thead><tbody>" + MINE.map(function (a, i) {
      return "<tr><td><b>" + esc(a.abbr) + "</b></td><td>" + esc(a.title) + "<div class=\"sub\">" + (a.items || []).length + " questions</div></td><td>" + esc(a.due && a.due.all ? a.due.all.replace("T", " ") : "") + "</td>" +
        "<td style=\"white-space:nowrap\"><button data-ed=\"" + i + "\">Edit</button> <button data-ln=\"" + i + "\">Copy link</button> <button data-del=\"" + i + "\">Delete</button></td></tr>";
    }).join("") + "</tbody></table>";
  }
  $("mine").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.hasAttribute("data-ed")) { load(MINE[+b.getAttribute("data-ed")]); window.scrollTo(0, 0); }
    else if (b.hasAttribute("data-ln")) { var u = linkOf(MINE[+b.getAttribute("data-ln")].id); try { navigator.clipboard.writeText(u); } catch (er) { } b.textContent = "Copied"; }
    else if (b.hasAttribute("data-del")) {
      var a = MINE[+b.getAttribute("data-del")]; if (!confirm("Delete " + a.abbr + "? Students' saved work stays, but the link stops working.")) return;
      AN.api("deleteAssignment", { id: a.id }).then(function () { if (cur.id === a.id) load(null); loadMine(); }).catch(function (er) { alert(er.message || "Could not delete."); });
    }
  });
  function loadMine() {
    if (!canSave()) { $("mine").innerHTML = "<div class=\"empty\">" + (window.AN && AN.enabled && AN.user && !AN.user.teacher ? "This page is for teachers." : "Sign in as a teacher to see your assignments.") + "</div>"; return; }
    AN.api("listAssignments").then(function (j) { MINE = (j.assignments || []).slice().reverse(); drawMine(); }).catch(function (e) { $("mine").innerHTML = "<div class=\"msg bad\">" + esc(e.message || "Could not load your assignments.") + "</div>"; });
  }
  drawBank(); drawItems(); loadMine();
})();
</script>
</body>
</html>
