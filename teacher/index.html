<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){var p=location.pathname.replace(/index\.html$/i,"").replace(/\/+$/,"").split("/").pop().toLowerCase();document.write('<script src="'+(p===""||p==="algebranotebook"?"":"../")+'auth.js"><\/script>')})()</script>
<title>Class Progress</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<style>
  :root { --ink: #111; --muted: #555; --line: #e3e3ea; --bg: #fff; --head: #f6f6f9; --plum: #8e1f4f; --bar: #2d70b3; --bar0: #eef1f7; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px 20px; padding: 18px 16px 10px; }
  h1 { font: 600 1.6rem Georgia, serif; margin: 0; }
  .sub { color: var(--muted); }
  .tools { display: flex; gap: 10px; align-items: center; margin-left: auto; }
  input[type=search] { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; min-width: 180px; }
  button { font: inherit; padding: 6px 12px; border: 1px solid var(--line); background: #fff; border-radius: 8px; cursor: pointer; }
  button:hover { border-color: #bbb; }
  .wrap { overflow: auto; margin: 0 16px 24px; border: 1px solid var(--line); border-radius: 10px; max-height: calc(100vh - 110px); }
  table { border-collapse: separate; border-spacing: 0; min-width: 100%; }
  th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; text-align: left; }
  thead th { position: sticky; top: 0; background: var(--head); z-index: 2; font-weight: 600; cursor: pointer; user-select: none; }
  th:first-child, td:first-child { position: sticky; left: 0; background: var(--bg); z-index: 1; }
  thead th:first-child { z-index: 3; background: var(--head); }
  td.p { min-width: 64px; }
  .pc { display: block; font-variant-numeric: tabular-nums; }
  .stars { display: inline-flex; gap: calc(var(--sz) * .1); line-height: 0; margin-top: 3px; } .stars .st { position: relative; display: inline-block; width: var(--sz); height: var(--sz); } .stars svg { display: block; width: var(--sz); height: var(--sz); } .stars .stG { position: absolute; left: 0; top: 0; height: 100%; overflow: hidden; }
  .full .pc { color: var(--plum); font-weight: 700; }
  .none { color: #bbb; }
  .email { color: var(--muted); font-size: .9em; }
  tr.open + tr.det td { background: #fafafc; }
  .det td { white-space: normal; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px 18px; padding: 4px 0; }
  .grid b { display: block; margin-top: 6px; }
  .msg { padding: 40px 16px; text-align: center; color: var(--muted); }
  .topbar { min-height: 22px; }
  .chk { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; } .chk label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap; }
  th .act { color: var(--bar); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; } th .act:hover { color: var(--plum); }
  th button.sort { border: 0; background: none; padding: 0 2px 0 6px; font: inherit; color: #888; cursor: pointer; } th button.sort.on { color: var(--ink); } th button.sort:hover { color: var(--plum); }
  thead th.ac { cursor: default; }
  @media (max-width: 600px) { .tools { margin-left: 0; width: 100%; flex-wrap: wrap; } input[type=search] { flex: 1; } }
</style>
</head>
<body>
<div class="topbar" data-an-chip></div>
<header>
  <h1>Class Progress</h1>
  <span class="sub" id="sub"></span>
  <div class="tools"><input type="search" id="q" placeholder="Find a student" aria-label="Find a student"><span class="chk" role="group" aria-label="Show activities"><label><input type="checkbox" data-f="1"> Ch1</label><label><input type="checkbox" data-f="2"> Ch2</label><label><input type="checkbox" data-f="3"> Ch3</label><label><input type="checkbox" data-f="recent"> Recent</label></span><button id="csv">Download CSV</button><button id="ref">Refresh</button></div>
</header>
<div class="wrap" id="wrap"><div class="msg">Loading…</div></div>
<script>
(function () {
  var ORDER = ["1.1A","1.1B","1.1C","1.2A","1.2B","1.2C","1.3A","1.3B","1.4A","1.4B","1.4C","1.4D","RevT1","2.1A","2.1B","2.2A","2.2B","2.2C","2.4A","2.4B"];
  var rows = [], acts = [], sortBy = "name", dir = 1, openRow = null;
  var $ = function (id) { return document.getElementById(id); };
  // Progress in stars, as the students see it: a finished activity is 5.0 stars, split over its exercises in tenths (larger shares first); each exercise earns
  // its share in proportion to how far it has come (the saved summary holds that as 0-100 per exercise), rounded down to a tenth
  function starW(n) { var b = n ? Math.floor(50 / n) : 0, r = 50 - b * n, w = []; for (var i = 0; i < n; i++) w.push(b + (i < r ? 1 : 0)); return w; }
  function exStars(ex) { var n = Object.keys(ex || {}), w = starW(n.length), o = {}; n.forEach(function (k, i) { o[k] = [Math.floor((+ex[k] || 0) * w[i] / 100 + 1e-9), w[i]]; }); return o; }   // name: [earned, share], in tenths
  function stars(ex) { var n = Object.keys(ex || {}); if (!n.length) return null; var o = exStars(ex), t = 0; n.forEach(function (k) { t += o[k][0]; }); return t; }
  function st1(t) { return (t / 10).toFixed(1); }
  var SP = "M12 1.2 14.9 8.4 22.6 8.9 16.7 13.9 18.6 21.5 12 17.3 5.4 21.5 7.3 13.9 1.4 8.9 9.1 8.4Z";
  function starsHTML(t, px) { var h = "<span class=\"stars\" style=\"--sz:" + px + "px\" aria-hidden=\"true\">"; for (var i = 0; i < 5; i++) { var f = Math.max(0, Math.min(1, (t - i * 10) / 10)); h += "<span class=\"st\"><svg viewBox=\"0 0 24 24\"><path d=\"" + SP + "\" fill=\"#7C8079\"/></svg><span class=\"stG\" style=\"width:" + (f * 100) + "%\"><svg viewBox=\"0 0 24 24\"><path d=\"" + SP + "\" fill=\"#EDBB3F\"/></svg></span></span>"; } return h + "</span>"; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function when(iso) { if (!iso) return "never"; var d = new Date(iso), m = (Date.now() - d) / 6e4; if (m < 2) return "just now"; if (m < 60) return Math.round(m) + " min ago"; if (m < 1440) return Math.round(m / 60) + " h ago"; return d.toLocaleDateString(); }
  function msg(t) { $("wrap").innerHTML = '<div class="msg">' + esc(t) + "</div>"; }

  function load() {
    if (!window.AN || !AN.enabled) return msg("Google sign-in is not switched on yet (auth.js needs its client ID and server address).");
    if (!AN.user) return;                        // the sign-in screen is showing
    if (!AN.user.teacher) return msg("This page is for teachers.");
    msg("Loading…");
    AN.api("roster").then(function (j) {
      var me = String(AN.user.email || "").toLowerCase();
      rows = (j.students || []).filter(function (r) { return String(r.email || "").toLowerCase() !== me; });   // (the teacher's own progress is not a student's)
      var seen = {}; rows.forEach(function (r) { Object.keys(r.detail || {}).forEach(function (a) { if (a.charAt(0) !== "_") seen[a] = 1; }); });
      acts = ORDER.filter(function (a) { return seen[a]; }).concat(Object.keys(seen).filter(function (a) { return ORDER.indexOf(a) < 0; }).sort());
      $("sub").textContent = rows.length + " student" + (rows.length === 1 ? "" : "s");
      draw();
    }).catch(function (e) { msg(e.message || "Could not load the class."); });
  }
  function val(r, k) { if (k === "name") return (r.name || r.email).toLowerCase(); if (k === "saved") return r.saved || ""; var a = stars((r.detail || {})[k]); return a == null ? -1 : a; }
  // which activities to show: the checked chapters (none checked: all), and with Recent the 3 whose progress changed most recently across the class
  function chap(a) { var m = /^(\d+)\./.exec(a) || /^RevT(\d+)/i.exec(a); return m ? m[1] : ""; }
  function changed(a) {   // when the class last changed this activity (saved with each student's progress; older saves: the student's last save, if they have progress in it)
    var t = 0; rows.forEach(function (r) { var d = r.detail || {}, v = +d["_t:" + a] || 0; if (!v && stars(d[a]) > 0) v = Date.parse(r.saved) || 0; if (v > t) t = v; }); return t;
  }
  function shown() {
    var on = {}; [].forEach.call(document.querySelectorAll(".chk input"), function (c) { on[c.dataset.f] = c.checked; });
    var L = acts.filter(function (a) { return !(on["1"] || on["2"] || on["3"]) || on[chap(a)]; });
    if (on.recent) L = L.map(function (a) { return [a, changed(a)]; }).filter(function (x) { return x[1] > 0; }).sort(function (x, y) { return y[1] - x[1]; }).slice(0, 3).map(function (x) { return x[0]; }).sort(function (x, y) { return acts.indexOf(x) - acts.indexOf(y); });
    return L;
  }
  function slug(a) { return String(a).toLowerCase().replace(/\./g, "-").replace(/\s+/g, ""); }
  function draw() {
    var q = $("q").value.trim().toLowerCase(), acts = shown();
    var list = rows.filter(function (r) { return !q || (r.name + " " + r.email).toLowerCase().indexOf(q) >= 0; })
      .sort(function (a, b) { var x = val(a, sortBy), y = val(b, sortBy); return (x < y ? -1 : x > y ? 1 : 0) * dir; });
    if (!rows.length) return msg("No students have signed in yet.");
    var arrow = function (k) { return sortBy === k ? (dir > 0 ? " ▲" : " ▼") : ""; };
    var h = "<table><thead><tr><th data-k=\"name\">Student" + arrow("name") + "</th><th data-k=\"saved\">Last saved" + arrow("saved") + "</th>";
    acts.forEach(function (a) { var on = sortBy === a; h += "<th class=\"ac\"><a class=\"act\" href=\"../" + esc(slug(a)) + "/\" title=\"Open " + esc(a) + "\">" + esc(a) + "</a><button type=\"button\" class=\"sort" + (on ? " on" : "") + "\" data-k=\"" + esc(a) + "\" aria-label=\"Sort by " + esc(a) + " progress\">" + (on ? (dir > 0 ? "▲" : "▼") : "↕") + "</button></th>"; });
    h += "</tr></thead><tbody>";
    list.forEach(function (r) {
      var isOpen = openRow === r.email;
      h += "<tr data-e=\"" + esc(r.email) + "\"" + (isOpen ? " class=\"open\"" : "") + " style=\"cursor:pointer\"><td><div>" + esc(r.name || r.email) + "</div><div class=\"email\">" + esc(r.email) + "</div></td><td>" + esc(when(r.saved)) + "</td>";
      acts.forEach(function (a) {
        var ex = (r.detail || {})[a], p = stars(ex), es = exStars(ex);
        var tip = ex ? Object.keys(es).map(function (n) { return n + ": " + st1(es[n][0]) + " of " + st1(es[n][1]) + " stars"; }).join("\n") : "";
        h += p == null || p === 0 && !Object.keys(ex || {}).some(function (n) { return ex[n] > 0; })
          ? "<td class=\"p none\" title=\"" + esc(tip) + "\">–</td>"
          : "<td class=\"p" + (p === 50 ? " full" : "") + "\" title=\"" + esc(tip) + "\" aria-label=\"" + st1(p) + " of 5 stars\"><span class=\"pc\">" + st1(p) + "</span></td>";
      });
      h += "</tr>";
      if (isOpen) {
        h += "<tr class=\"det\"><td colspan=\"" + (acts.length + 2) + "\"><div class=\"grid\">";
        acts.forEach(function (a) { var ex = (r.detail || {})[a] || {}; h += "<div><b>" + esc(a) + "</b>" + (function (es) { return Object.keys(es).map(function (n) { return esc(n) + ": " + st1(es[n][0]) + " of " + st1(es[n][1]) + " ★"; }).join("<br>"); })(exStars(ex)) + "</div>"; });
        h += "</div></td></tr>";
      }
    });
    $("wrap").innerHTML = h + "</tbody></table>";
  }
  $("wrap").addEventListener("click", function (e) {
    if (e.target.closest("a.act")) return;   // (the activity name opens the activity)
    var th = e.target.closest("button.sort") || e.target.closest("th[data-k]"); if (th) { var k = th.dataset.k; if (sortBy === k) dir = -dir; else { sortBy = k; dir = k === "name" ? 1 : -1; } return draw(); }
    if (e.target.closest("th")) return;
    var tr = e.target.closest("tr[data-e]"); if (tr) { openRow = openRow === tr.dataset.e ? null : tr.dataset.e; draw(); }
  });
  $("q").addEventListener("input", draw);
  [].forEach.call(document.querySelectorAll(".chk input"), function (c) { try { c.checked = localStorage.getItem("an:tf:" + c.dataset.f) === "1"; } catch (e) { } c.addEventListener("change", function () { try { localStorage.setItem("an:tf:" + c.dataset.f, c.checked ? "1" : "0"); } catch (e) { } draw(); }); });
  $("ref").addEventListener("click", load);
  $("csv").addEventListener("click", function () {
    var cols = ["Name", "Email", "Last saved"], lines = [];
    acts.forEach(function (a) { var names = {}; rows.forEach(function (r) { Object.keys((r.detail || {})[a] || {}).forEach(function (n) { names[n] = 1; }); }); Object.keys(names).forEach(function (n) { cols.push(a + " " + n); }); });   // (each exercise's stars earned)
    lines.push(cols);
    rows.forEach(function (r) {
      var line = [r.name, r.email, r.saved];
      cols.slice(3).forEach(function (c) { var a = acts.filter(function (x) { return c.indexOf(x + " ") === 0; }).sort(function (x, y) { return y.length - x.length; })[0], n = c.slice(a.length + 1), ex = (r.detail || {})[a] || {}; var es = exStars(ex); line.push(n in es ? st1(es[n][0]) : ""); });
      lines.push(line);
    });
    var csv = lines.map(function (l) { return l.map(function (v) { v = String(v == null ? "" : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(","); }).join("\n");
    var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = "algebra-notebook-progress.csv"; a.click();
  });
  load();
})();
</script>
</body>
</html>
