<div class="dlgBg" id="gcDlg" hidden><div class="dlg" role="dialog" aria-labelledby="gcT"><h2 id="gcT">Sync with Google Classroom</h2><p>Choose your classes. Students who aren't in them leave this list (their saved work is kept, and comes back if they rejoin); students who are in them and haven't signed in yet are added. The classes' teachers can open this page.</p><div class="gcList" id="gcList"></div><div class="dlgB"><button id="gcNo">Cancel</button><button id="gcGo" class="pri">Sync</button></div></div></div>
<script>
(function () {

  // Class dates and starting times (school year 2026-27; New York time) — the choices in each activity's Due list
  var CLASS = "11/2 1:55,11/4 9:15,11/5 12:55,11/10 8:15,11/11 11:00,11/12 1:55,11/16 9:15,11/17 12:55,11/19 8:15,11/20 11:00,11/23 1:55,11/30 9:15,12/1 12:55,12/3 8:15,12/4 11:00,12/7 1:55,12/9 9:15,12/10 12:55,12/14 8:15,12/15 11:00,12/16 1:55,12/18 9:15,1/4 12:55,1/6 8:15,1/7 11:00,1/8 1:55,1/12 9:15,1/13 12:55,1/15 8:15,1/19 11:00,1/20 1:55,1/22 9:15,1/25 12:55,1/27 8:15,1/28 11:00,1/29 1:55,2/2 9:15,2/3 12:55,2/5 8:15,2/8 11:00,2/9 1:55,2/11 9:15,2/16 12:55,2/18 8:15,2/19 11:00,2/22 1:55,2/24 9:15,2/25 12:55,3/1 8:15,3/2 11:00,3/3 1:55,3/5 9:15,3/8 12:55,3/10 8:15,3/11 11:00,3/12 1:55,3/16 9:15,3/17 12:55,3/31 8:15,4/1 11:00,4/2 1:55,4/6 9:15,4/7 12:55,4/9 8:15,4/12 11:00,4/13 1:55,4/15 9:15,4/16 12:55,4/20 8:15,4/21 11:00,4/22 1:55,4/26 9:15,4/27 12:55,4/29 8:15,5/3 11:00,5/4 1:55,5/6 9:15,5/7 12:55,5/11 8:15,5/12 11:00,5/13 1:55,5/17 9:15,5/18 12:55,5/20 8:15,5/21 11:00,5/24 1:55,5/26 9:15,5/27 12:55".split(",").map(function (x) {

  function dueMs(v) { var p = parseDue(v); if (!p) return 0; return p.h == null ? nyMs(p.y, p.mo, p.d, 23, 59) + 59999 : nyMs(p.y, p.mo, p.d, p.h, p.mi); }

  function dueEnd(a) { return dueMs(due[a]); }

  function chap(a) { var m = /^(\d+)\./.exec(a) || /^Rev[TQ](\d+)/i.exec(a); return m ? m[1] : ""; }

      acts.forEach(function (a) {
        var ex = (r.detail || {})[a], p = stars(ex), es = exStars(ex);
        var tip = ex ? Object.keys(es).map(function (n) { return n + ": " + st1(es[n][0]) + " of " + st1(es[n][1]) + " stars"; }).join("\n") : "";

      }

    $("wrap").innerHTML = h + "</tbody></table>";
  }
  $("wrap").addEventListener("click", function (e) {

  // a due date and time: "Due" opens a list of the class dates and starting times; the choice is saved for the class at once ("None" removes it)

    menu.addEventListener("click", function (e) { var o = e.target.closest("[data-v]"); if (!o) return; closeDue(); saveDue(a, o.dataset.v); });
  }
  function placeDue() {   // under its "Due" link (above it when there is no room below); closed once the link scrolls out of view
    if (!menu) return; var r = menu.btn.getBoundingClientRect(), W = $("wrap").getBoundingClientRect(), w = menu.offsetWidth, hgt = menu.offsetHeight;
    if (!menu.btn.isConnected || r.right < W.left || r.left > W.right) return closeDue();
    var left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)), top = r.bottom + 4;
    if (top + hgt > window.innerHeight - 8 && r.top - hgt - 4 > 8) top = r.top - hgt - 4;
    menu.style.left = left + "px"; menu.style.top = Math.max(8, top) + "px";
  }
  function saveDue(a, v) {
    var before = due[a]; if (v) due[a] = v; else delete due[a]; draw();
    AN.api("setDue", { act: a, date: v }).then(function (j) { due = j.due || due; draw(); }).catch(function (er) {
      if (v && /T/.test(v) && /date/i.test(er.message || "")) {   // (an Apps Script not yet updated takes dates only: the date is saved, and the time waits for the update)
        return AN.api("setDue", { act: a, date: v.slice(0, 10) }).then(function (j) { due = j.due || due; draw(); alertBar("The due date was saved without its time: the Apps Script (server/Code.gs) needs to be updated and redeployed to save due times."); });
      }
      throw er;
    }).catch(function (er) { if (before) due[a] = before; else delete due[a]; draw(); alertBar(er.message || "Could not save the due date."); });
  }
  document.addEventListener("pointerdown", function (e) { if (menu && !menu.contains(e.target) && !e.target.closest("button.dueL")) closeDue(); }, true);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && menu) closeDue(); });
  window.addEventListener("resize", closeDue);
  $("wrap").addEventListener("scroll", placeDue); window.addEventListener("scroll", placeDue);
  function alertBar(t) { var m = $("note"); m.textContent = t; m.hidden = false; clearTimeout(alertBar.t); alertBar.t = setTimeout(function () { m.hidden = true; }, 8000); }
  // Google Classroom: choose the classes, then the student list is made to match them
  $("gc").addEventListener("click", function () {
    var D = $("gcDlg"), L = $("gcList"); L.innerHTML = "Loading your classes…"; $("gcGo").disabled = true; D.hidden = false;
    AN.api("courses").then(function (j) {
      var cs = j.courses || [], last = j.last || [];
      if (!cs.length) { L.textContent = "No active Google Classroom classes were found where you are a teacher."; return; }
      L.innerHTML = cs.map(function (c) { return "<label><input type=\"checkbox\" value=\"" + esc(c.id) + "\"" + (last.indexOf(c.id) >= 0 || cs.length === 1 ? " checked" : "") + "> " + esc(c.name) + "</label>"; }).join("");
      $("gcGo").disabled = false;
    }).catch(function (er) { L.textContent = (er.message || "Could not reach Google Classroom.") + " (The Apps Script needs the Google Classroom service: see the note at the top of Code.gs.)"; });
  });
  $("gcNo").addEventListener("click", function () { $("gcDlg").hidden = true; });
  $("gcGo").addEventListener("click", function () {
    var ids = [].map.call(document.querySelectorAll("#gcList input:checked"), function (c) { return c.value; });
    if (!ids.length) { $("gcList").insertAdjacentHTML("beforeend", "<div class=\"gcErr\">Choose at least one class.</div>"); return; }
    $("gcGo").disabled = true; $("gcGo").textContent = "Syncing…";
    AN.api("syncClassroom", { courseIds: ids }).then(function (j) {
      $("gcDlg").hidden = true; $("gcGo").textContent = "Sync";
      alertBar("Synced with Google Classroom: " + j.students + " students in the class" + (j.added ? ", " + j.added + " added" : "") + (j.removed ? ", " + j.removed + " removed from the list (their saved work is kept)" : "") + ".");
      load();
    }).catch(function (er) { $("gcGo").disabled = false; $("gcGo").textContent = "Sync"; $("gcList").insertAdjacentHTML("beforeend", "<div class=\"gcErr\">" + esc(er.message || "The sync didn't finish.") + "</div>"); });
  });
  [].forEach.call(document.querySelectorAll(".chk input"), function (c) { try { c.checked = localStorage.getItem("an:tf:" + c.dataset.f) === "1"; } catch (e) { } c.addEventListener("change", function () { try { localStorage.setItem("an:tf:" + c.dataset.f, c.checked ? "1" : "0"); } catch (e) { } draw(); }); });
  $("ref").addEventListener("click", load);
  $("csv").addEventListener("click", function () {
    var cols = ["Name", "Email", "Last saved"], lines = [];
    acts.forEach(function (a) { var names = {}; rows.forEach(function (r) { Object.keys((r.detail || {})[a] || {}).forEach(function (n) { names[n] = 1; }); }); Object.keys(names).forEach(function (n) { cols.push(a + " " + n); }); });   // (each exercise's stars earned)
    lines.push(cols);
    rows.forEach(function (r) {
      var line = [r.name, r.email, r.saved];
      cols.slice(3).forEach(function (c) { var a = acts.filter(function (x) { return c.indexOf(x + " ") === 0; }).sort(function (x, y) { return y.length - x.length; })[0], n = c.slice(a.length + 1), ex = (r.detail || {})[a] || {}; var es = exStars(ex); line.push(n in es ? st1(es[n][0]) : ""); });
      lines.push(line);
    });
    var csv = lines.map(function (l) { return l.map(function (v) { v = String(v == null ? "" : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(","); }).join("\n");
    var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = "algebra-notebook-progress.csv"; a.click();
  });
  load();
})();
</script>
