<style>
  :root{--bg:#EEF1F6;--ink:#1B2433;--plus:#2F5BEA;--plus-hover:#1E44C4;--no:#D2432F;box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181F;--ink:#E8ECF4;--plus:#7C9CFF;--plus-hover:#A3B8FF;--no:#FF7A66}}
  :root[data-theme="dark"]{--bg:#14181F;--ink:#E8ECF4;--plus:#7C9CFF;--plus-hover:#A3B8FF;--no:#FF7A66}
  :root[data-mode="demo"]{--bg:#F6F4EE;--ink:#1B2433;--plus:#2F5BEA;--plus-hover:#1E44C4;--no:#C0301E}
  :root[data-mode="sequence"]{--bg:#ECF8F0;--ink:#0F2A1B;--plus:#0B6E3A;--plus-hover:#07522B;--no:#C0301E}
  :root[data-mode="solo"]{--bg:#FFFFFF;--ink:#24113D;--plus:#6A2FB8;--plus-hover:#4E1F8C;--no:#C0301E}
  :root[data-mode="create"]{--bg:#FDF7E6;--ink:#3A2A05;--plus:#9A5B00;--plus-hover:#704200;--no:#C0301E}
  :root[data-mode="calculate"]{--bg:#EBF2FE;--ink:#0E1B38;--plus:#1F43B8;--plus-hover:#152F8A;--no:#C0301E}
  body{transition:background-color .5s,color .5s}
  html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
  body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Fraunces",Georgia,"Times New Roman",serif}
  /* the layout lives in its own container with each part pinned to its place, so anything a browser extension
     adds to the page (school-managed Chrome often does) can't push the work area or the panel out of position */
  .app{position:fixed;inset:0;box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);display:grid;grid-template-columns:minmax(0,1fr) min(19rem,32vw);grid-template-rows:minmax(0,1fr)}
  .app>.stage{grid-column:1;grid-row:1}
  .app>.chat{grid-column:2;grid-row:1}
  .eqs,.chip,.sheet .r{font-family:"LM","Latin Modern Roman","CMU Serif","STIX Two Text",Georgia,"Times New Roman",serif}
  .stage{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:auto;padding:.8rem 1rem}
  .wrap{margin:auto;display:flex;flex-direction:column;align-items:center;gap:.9rem;padding:1rem 0;max-width:100%}
  .vals{display:flex;gap:1rem;justify-content:center;min-height:2.6rem;font-size:clamp(1.3rem,3.4vw,2rem);font-weight:400;padding:.4rem 0}
  .chip{display:inline-flex;gap:.3em;padding:.2em .8em;border-radius:999px;background:color-mix(in srgb,var(--ink) 8%,var(--bg))}
  select{font:600 .95rem system-ui,sans-serif;color:var(--ink);background:var(--bg);border:2px solid var(--ink);border-radius:999px;padding:.55em 1em}
  .eqs{display:grid;grid-template-columns:repeat(var(--nc,7),auto);column-gap:.12em;row-gap:.7rem;justify-content:center;font-weight:400;max-width:100%}
  .orig{font-size:clamp(1rem,2.6vw,1.6rem)}
  .top{display:flex;gap:2.2rem;justify-content:center;align-items:flex-start;flex-wrap:wrap}
  .top .vals{flex-direction:column;align-items:flex-start;gap:.5rem;min-height:0;padding:0;font-size:clamp(1rem,2.2vw,1.5rem)}
  .vals:empty{display:none}
  #party{position:fixed;inset:0;z-index:100;pointer-events:none;overflow:hidden}
  .pe{position:absolute;line-height:1;will-change:transform}
  .slay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:1rem;color:#fff;
    font:900 clamp(2.5rem,11vw,7rem)/1.05 Impact,"Arial Black",system-ui,sans-serif;text-shadow:0 .06em 0 #ff2d95,0 .12em 0 #6a2fb8,0 0 .5em rgba(255,255,255,.6)}
  .frame{display:grid;grid-template-columns:minmax(0,1fr);column-gap:1rem;align-items:start;flex:1 0 auto;min-height:100%}
  .center{display:flex;flex-direction:column;min-width:0;min-height:100%}
  .ctlbox{display:flex;flex-direction:column;gap:2.5rem;padding:.9rem 1rem;border-bottom:2px solid color-mix(in srgb,var(--ink) 12%,transparent)}
  /* ONE divider in the side panel, below the last button: when the Check / Next block follows the controls, the line goes under that block, not between */
  .ctlbox{border-bottom:0}
  .qz{border-bottom:0}

          toTop(function () { key("ArrowRight"); pgWait(600, function () { (function ys(i) { if (i > 6) { n(); return; } typeHere(DYS[i], function () { ys(i + 1); }); })(0); }); });
        },
        function (n) { cap("Press Regression"); tap(tog("reg"), function () { pgWait(2600, n); }); },
        function (n) {
          cap("Change families");
          (function again(i) { if (i >= 6) { pgWait(2200, n); return; } tap($("pgFam"), function () { pgWait(i === 5 ? 600 : 1100, function () { again(i + 1); }); }); })(0);
        },
        function (n) { cap("Home view"); tap($("zmHome"), function () { pgWait(2000, function () { cap("Zoom to data"); tap($("zmData"), function () { pgWait(2400, n); }); }); }); }
      ].concat([
        function (n) { cap("Your turn"); pgWait(2500, n); }
      ]);
    }
    (function next() { if (pgRun !== run) return; if (k >= steps.length) { PG.demoFin = true; pgStop(); return; } steps[k++](next); })();
  }
  // one button starts, pauses and resumes the demo; End demo appears while it is paused
  $("pgDemo").addEventListener("click", function () { if (dmClickFinish()) return; if (!pgRun) pgDemo(); else if (!pgPaused) pgPause(); else pgResume(); });
  $("pgEnd").addEventListener("click", function () { pgStop(); });
  $("dmBtn").addEventListener("click", dm4Click);
  ["pgLink", "dmLink"].forEach(function (id) { $(id).addEventListener("click", function () { var d = DMX; if (d && d.stayGo) { dmUI("idle"); d.stayGo(); } }); });
  $("dmEnd").addEventListener("click", dm4End);

  function enterPlay() {
    stopDemo(); stopParty(); closeAsk(false); busy = false; calc = null;
    document.body.classList.add("play"); document.body.classList.toggle("dataAct", isDataAct()); theme();
    { var kd = isDataAct() ? "d" : "g"; if (PG.kind !== kd) { PG.kind = kd; PG.fam = kd === "d" ? 1 : 0; PG.a = 1; PG.h = 0; PG.k = 0; PG.pa = [1, 1]; PG.pts = []; PG.sp = []; PG.shape = null; PG.clk = []; PG.tbl = null; PG.drows = null; PG.eqTxt = ""; PG.editEq = false; Object.keys(PG.show).forEach(function (q) { PG.show[q] = false; }); PG.show.eq = kd !== "d"; } }   // a Data Activity starts with the line family and everything hidden
    $("pg").hidden = false; document.querySelector(".frame").hidden = true; $("pgCtl").hidden = false; $("prog").hidden = true; logEl.innerHTML = "";
    drawPlay();
  }
  function leavePlay() {
    if (pgRun) pgStop(); closePt();
    document.body.classList.remove("play", "dataAct"); if ($("regVals")) $("regVals").hidden = true; $("qzTools").hidden = true; $("pg").hidden = true; document.querySelector(".frame").hidden = false; $("pgCtl").hidden = true;
  }

  buildActs(); buildLessons(); updProg();
  if (BUILT[act].play) { setMode("demo"); enterPlay(); } else if (BUILT[act].quiz) enterQuiz(); else setMode("demo");
  if (welcome) { document.body.classList.add("wel"); theme(); $("welcome").hidden = false; }
</script>
