<style>
  :root{--bg:#EEF1F6;--ink:#1B2433;--plus:#2F5BEA;--plus-hover:#1E44C4;--no:#D2432F;box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181F;--ink:#E8ECF4;--plus:#7C9CFF;--plus-hover:#A3B8FF;--no:#FF7A66}}
  :root[data-theme="dark"]{--bg:#14181F;--ink:#E8ECF4;--plus:#7C9CFF;--plus-hover:#A3B8FF;--no:#FF7A66}
  :root[data-mode="demo"]{--bg:#0B0D12;--ink:#F1F4FA;--plus:#8FA9FF;--plus-hover:#B7C8FF;--no:#FF7A66}
  :root[data-mode="sequence"]{--bg:#C9EBD3;--ink:#0F2A1B;--plus:#0B6E3A;--plus-hover:#07522B;--no:#C0301E}
  :root[data-mode="solo"]{--bg:#E1D4F6;--ink:#24113D;--plus:#6A2FB8;--plus-hover:#4E1F8C;--no:#C0301E}
  :root[data-mode="create"]{--bg:#F8E7B9;--ink:#3A2A05;--plus:#9A5B00;--plus-hover:#704200;--no:#C0301E}
  :root[data-mode="calculate"]{--bg:#C7DBFB;--ink:#0E1B38;--plus:#1F43B8;--plus-hover:#152F8A;--no:#C0301E}
  body{transition:background-color .5s,color .5s}
  html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
  body{margin:0;height:100%;display:grid;grid-template-columns:minmax(0,1fr) min(19rem,32vw);background:var(--bg);color:var(--ink);font-family:"Fraunces",Georgia,"Times New Roman",serif}
  .eqs,.chip,.sheet .r{font-family:"LM","Latin Modern Roman","CMU Serif","STIX Two Text",Georgia,"Times New Roman",serif}
  .stage{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:auto;padding:.8rem 1rem}
  .wrap{margin:auto;display:flex;flex-direction:column;align-items:center;gap:.9rem;padding:1rem 0;max-width:100%}
  .vals{display:flex;gap:1rem;justify-content:center;min-height:2.6rem;font-size:clamp(1.3rem,3.4vw,2rem);font-weight:400;padding:.4rem 0}
  .chip{display:inline-flex;gap:.3em;padding:.2em .8em;border-radius:999px;background:color-mix(in srgb,var(--ink) 8%,var(--bg))}
  select{font:600 .95rem system-ui,sans-serif;color:var(--ink);background:var(--bg);border:2px solid var(--ink);border-radius:999px;padding:.55em 1em}
  .eqs{display:grid;grid-template-columns:repeat(var(--nc,7),auto);column-gap:.12em;row-gap:.7rem;justify-content:center;font-weight:400;max-width:100%}
  .orig{font-size:clamp(1rem,2.6vw,1.6rem)}
  .top{display:flex;gap:2.2rem;justify-content:center;align-items:flex-start;flex-wrap:wrap}
  .top .vals{flex-direction:column;align-items:flex-start;gap:.5rem;min-height:0;padding:0;font-size:clamp(1rem,2.2vw,1.5rem)}
  .vals:empty{display:none}
  #party{position:fixed;inset:0;z-index:100;pointer-events:none;overflow:hidden}
  .pe{position:absolute;line-height:1;will-change:transform}
  .slay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:1rem;color:#fff;
    font:900 clamp(2.5rem,11vw,7rem)/1.05 Impact,"Arial Black",system-ui,sans-serif;text-shadow:0 .06em 0 #ff2d95,0 .12em 0 #6a2fb8,0 0 .5em rgba(255,255,255,.6)}
  .frame{display:grid;grid-template-columns:minmax(0,1fr);column-gap:1rem;align-items:start;flex:1 0 auto;min-height:100%}
  .center{display:flex;flex-direction:column;min-width:0;min-height:100%}
  .ctlbox{display:flex;flex-direction:column;gap:2.5rem;padding:.9rem 1rem;border-bottom:2px solid color-mix(in srgb,var(--ink) 12%,transparent)}
  .ctl-sel{display:flex;flex-direction:column;align-items:center;gap:.5rem}.ctl-sel select{box-sizing:border-box;width:10.5em;font-size:.92rem;padding:.6em .8em}
  .ctl-btn{display:flex;flex-direction:column;align-items:center;gap:.5rem}
  .ctl-btn .btn{box-sizing:border-box;width:10.5em;padding:.6em .6em;font-size:.92rem;text-align:center;white-space:nowrap}
  .ctl{display:flex;flex-direction:column;gap:.5rem;position:sticky;top:0;z-index:3}
  .ctl-l{align-items:stretch}.ctl-r{align-items:stretch}
  .ctl .btn{padding:.6em 1.1em;font-size:.92rem;text-align:center;white-space:nowrap}
  .btn.on{background:var(--ink);color:var(--bg)}
  .link[hidden]{display:none}

<body>
  <div class="stage">

    </div>
    </div>

<script>

  var orig = [], ws = [], rows = [], orows = [], srows = [], sys = [], sysV = [], elim = "", elimInfo = null;

  var vals = {}, hist = [], steps = [], ops = 0, locked = false, busy = false, colMin = [];

  function svgEl(t, at) { var e = document.createElementNS("http://www.w3.org/2000/svg", t); for (var k in at) e.setAttribute(k, at[k]); return e; }
  // polylines for a curve (a quadratic is cut into pieces where it leaves the window)
  function curvePts(fn) {
    var f = FAMS[PG.fam], segs = [], cur = [];
    if (f === "quadratic") {
      for (var x = -10.5; x <= 10.501; x += .05) { var y = fn(x); if (y > -12 && y < 12) cur.push(x.toFixed(3) + "," + (-y).toFixed(3)); else if (cur.length) { segs.push(cur); cur = []; } }
      if (cur.length) segs.push(cur);
    } else {
      var xs = f === "absolute value" ? [-10.5, fn === pf ? 0 : H(), 10.5] : [-10.5, 10.5];
      segs.push(xs.map(function (x) { return x + "," + (-fn(x)); }));
    }
    return segs.filter(function (c) { return c.length > 1; }).map(function (c) { return c.join(" "); });
  }
  function drawGraph() {
    var S = $("pgSvg"); S.innerHTML = "";
    if (PG.show.graph) {
      var gr = svgEl("g", { stroke: "#E3E5E8", "stroke-width": ".05" });
      for (var i = -10; i <= 10; i++) { gr.appendChild(svgEl("line", { x1: i, y1: -10, x2: i, y2: 10 })); gr.appendChild(svgEl("line", { x1: -10, y1: i, x2: 10, y2: i })); }
      S.appendChild(gr);
      S.appendChild(svgEl("line", { x1: -10, y1: 0, x2: 10, y2: 0, stroke: "#222", "stroke-width": ".09" }));
      S.appendChild(svgEl("line", { x1: 0, y1: -10, x2: 0, y2: 10, stroke: "#222", "stroke-width": ".09" }));
      if (PG.show.parent) {
        curvePts(pf).forEach(function (pts) { S.appendChild(svgEl("polyline", { points: pts, fill: "none", stroke: "#222", "stroke-width": ".07", "stroke-dasharray": ".3 .25" })); });
        for (var u = -2; u <= 2; u++) S.appendChild(svgEl("circle", { cx: u, cy: -pf(u), r: .13, fill: "#222" }));
      }
      curvePts(g).forEach(function (pts) { S.appendChild(svgEl("polyline", { points: pts, fill: "none", stroke: "#C74440", "stroke-width": ".13", "stroke-linejoin": "round" })); });
      for (var v = -2; v <= 2; v++) { var y = g(v + H()); if (Math.abs(y) <= 10) S.appendChild(svgEl("circle", { cx: v + H(), cy: -y, r: .2, fill: "#C74440" })); }
    }
    // the two points are always there to drag, even with the graph hidden
    var vx = H(), vy = K();
    var vg = svgEl("g", { "data-pt": "v", style: "cursor:grab" });
    vg.appendChild(svgEl("circle", { cx: vx, cy: -vy, r: .62, fill: "#C74440", "fill-opacity": ".3" }));
    vg.appendChild(svgEl("circle", { cx: vx, cy: -vy, r: .2, fill: "#C74440" }));
    S.appendChild(vg);
    if (stretches()) {
      var ag = svgEl("g", { "data-pt": "a", style: "cursor:grab" });
      ag.appendChild(svgEl("circle", { cx: PG.pa[0], cy: -PG.pa[1], r: .62, fill: "#6042A6", "fill-opacity": ".3" }));
      ag.appendChild(svgEl("circle", { cx: PG.pa[0], cy: -PG.pa[1], r: .2, fill: "#6042A6" }));
      S.appendChild(ag);
    }
  }
  function drawPlay() {
    drawGraph();
    $("pgTable").querySelector("tbody").innerHTML = tableHTML();
    $("pgTable").querySelector(".pgMid").innerHTML = PG.show.eq ? eqHTML() : "";
    $("pgEq").innerHTML = PG.show.eq ? eqHTML() : "";
    $("pgDesc").innerHTML = PG.show.desc ? descHTML() : "";
    [].forEach.call(document.querySelectorAll(".tog"), function (b) { b.setAttribute("aria-pressed", PG.show[b.dataset.part] ? "true" : "false"); });
  }
  // drag: the red point snaps to whole numbers; the purple point's height is the stretch factor a (steps of 0.25, never 0)
  (function () {
    var S = $("pgSvg"), which = null;
    function at(e) { var m = S.getScreenCTM().inverse(), p = S.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; p = p.matrixTransform(m); return { x: p.x, y: -p.y }; }
    S.addEventListener("pointerdown", function (e) {
      if (pgRun) return;
      var t = e.target.closest("[data-pt]"); if (!t) return;
      which = t.dataset.pt;
      S.setPointerCapture(e.pointerId); e.preventDefault();
    });
    S.addEventListener("pointermove", function (e) {
      if (!which) return; var p = at(e), cl = function (v) { return Math.max(-10, Math.min(10, v)); };
      // the red point moves by whole units: up and down only for constant and linear, any direction for absolute value and quadratic
      if (which === "v") { var h = shifts() ? Math.round(cl(p.x)) : PG.h, k = Math.round(cl(p.y)); if (h === PG.h && k === PG.k) return; PG.h = h; PG.k = k; }
      else { var y = Math.round(cl(p.y) * 4) / 4; if (!y) y = p.y < 0 ? -.25 : .25; PG.pa = [PG.pa[0], y]; PG.a = y; }
      drawPlay();
    });
    function end() { which = null; }
    S.addEventListener("pointerup", end); S.addEventListener("pointercancel", end);
  })();
  $("pgFam").addEventListener("click", function (e) { if (pgRun && e.isTrusted) return; PG.fam = (PG.fam + 1) % FAMS.length; drawPlay(); });
  [].forEach.call(document.querySelectorAll(".tog"), function (b) { b.addEventListener("click", function (e) { if (pgRun && e.isTrusted) return; PG.show[b.dataset.part] = !PG.show[b.dataset.part]; drawPlay(); }); });
  // ---- 1.1 Play demo: the hand shows every control, one at a time ----
  var pgRun = 0, pgTimers = [];
  function svgPt(x, y) { var S = $("pgSvg"), m = S.getScreenCTM(), p = S.createSVGPoint(); p.x = x; p.y = -y; p = p.matrixTransform(m); return { x: p.x, y: p.y }; }
  function handAt(pt) { var h = hand(); h.style.transition = "none"; h.style.opacity = "1"; h.dataset.on = "1"; h.style.transform = "translate(" + (pt.x - HX) + "px," + (pt.y - HY) + "px)"; }
  function pgWait(ms, fn) { var id = setTimeout(function () { pgTimers.splice(pgTimers.indexOf(id), 1); fn(); }, ms); pgTimers.push(id); }
  function pgStop() {
    pgRun = 0; pgTimers.forEach(clearTimeout); pgTimers = []; handHide();
    $("pgDemo").textContent = "Demo"; $("pgDemo").classList.remove("on"); $("pgCap").textContent = "";
  }
  function pgDemo() {
    if (pgRun) { pgStop(); return; }
    var run = ++pgRun; $("pgDemo").textContent = "Stop demo"; $("pgDemo").classList.add("on");
    PG.fam = 0; PG.a = 2.25; PG.pa = [-5, 2.25]; PG.h = 0; PG.k = 0;
    Object.keys(PG.show).forEach(function (k) { PG.show[k] = false; }); drawPlay();
    function cap(t) { $("pgCap").textContent = t; }
    function tog(part) { return document.querySelector(".tog[data-part=\"" + part + "\"]"); }
    // tap a button: the hand travels to it, taps, then the button acts
    function tap(el, then) { handGo(ctr(el), 650); pgWait(800, function () { handTap(); pgWait(180, function () { el.click(); pgWait(650, then); }); }); }
    // drag a point: the hand grabs it and moves it smoothly; values snap like a student's drag
    function drag(which, to, then) {
      var from = which === "v" ? [H(), K()] : [PG.pa[0], PG.pa[1]], ms = 1500, t0 = null;
      handGo(svgPt(from[0], from[1]), 650);
      pgWait(800, function () {
        handTap();
        function step(ts) {
          if (pgRun !== run) return;
          if (t0 === null) t0 = ts; var u = Math.min(1, (ts - t0) / ms), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
          var x = from[0] + (to[0] - from[0]) * e, y = from[1] + (to[1] - from[1]) * e;
          if (which === "v") { PG.h = shifts() ? Math.round(x) : PG.h; PG.k = Math.round(y); }
          else { var a = Math.round(y * 4) / 4; if (!a) a = y < 0 ? -.25 : .25; PG.a = a; PG.pa = [PG.pa[0], a]; }
          drawPlay(); handAt(svgPt(which === "v" ? x : PG.pa[0], y));
          if (u < 1) requestAnimationFrame(step); else pgWait(500, then);
        }
        requestAnimationFrame(step);
      });
    }
    var steps = [
      function (n) { cap("Each button on the right shows or hides one part. Start with the graph."); tap(tog("graph"), n); },
      function (n) { cap("The table lists x-values and their y-values."); tap(tog("table"), n); },
      function (n) { cap("The equation appears under the table and at the top of the table."); tap(tog("eq"), n); },
      function (n) { cap("The description names the family and its transformations."); tap(tog("desc"), n); },
      function (n) { cap("Parent shows the original graph as a dashed line. Now every part is showing."); tap(tog("parent"), n); },
      function (n) { cap("Drag the red point. In the constant family it moves up and down only."); drag("v", [0, 3], n); },
      function (n) { cap("Change Family steps through the four families."); tap($("pgFam"), n); },
      function (n) { cap("The purple point sets the vertical stretch. Below the x-axis, the graph reflects."); drag("a", [PG.pa[0], -2], n); },
      function (n) { cap("Next family: absolute value."); tap($("pgFam"), n); },
      function (n) { cap("Now the red point moves the vertex left, right, up and down."); drag("v", [3, 2], n); },
      function (n) { cap("Next family: quadratic."); tap($("pgFam"), n); },
      function (n) { cap("A stretch between −1 and 1 is a vertical shrink."); drag("a", [PG.pa[0], .5], n); },
      function (n) { cap("Move the vertex and watch the equation, table and description change together."); drag("v", [-2, -3], n); },
      function (n) { cap("Hide the graph and use the other parts to picture it."); tap(tog("graph"), n); },
      function (n) { cap("Then show it again to check."); tap(tog("graph"), n); },
      function (n) { cap("Your turn: try every button and drag both points."); pgWait(2200, n); }
    ];
    var k = 0;
    (function next() { if (pgRun !== run) return; if (k >= steps.length) { pgStop(); return; } steps[k++](next); })();
  }
  $("pgDemo").addEventListener("click", pgDemo);

  function enterPlay() {
    stopDemo(); stopParty(); closeAsk(false); busy = false; calc = null;
    document.documentElement.dataset.mode = "playground"; document.body.classList.add("play");
    $("pg").hidden = false; document.querySelector(".frame").hidden = true; $("pgCtl").hidden = false; $("prog").hidden = true; logEl.innerHTML = "";
    drawPlay();
  }
  function leavePlay() {
    if (pgRun) pgStop();
    document.body.classList.remove("play"); $("pg").hidden = true; document.querySelector(".frame").hidden = false; $("pgCtl").hidden = true;
  }

  buildActs(); buildLessons(); updProg();
  if (BUILT[act].play) { setMode("demo"); enterPlay(); } else setMode("demo");
  if (welcome) { document.body.classList.add("wel"); document.documentElement.dataset.mode = "welcome"; $("welcome").hidden = false; }
</script>
