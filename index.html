<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solving systems of equations</title>
<style>
  :root{--bg:#EEF1F6;--ink:#1B2433;--plus:#2F5BEA;--plus-hover:#1E44C4;--no:#D2432F;box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181F;--ink:#E8ECF4;--plus:#7C9CFF;--plus-hover:#A3B8FF;--no:#FF7A66}}
  :root[data-theme="dark"]{--bg:#14181F;--ink:#E8ECF4;--plus:#7C9CFF;--plus-hover:#A3B8FF;--no:#FF7A66}
  :root[data-mode="demo"]{--bg:#0B0D12;--ink:#F1F4FA;--plus:#8FA9FF;--plus-hover:#B7C8FF;--no:#FF7A66}
  :root[data-mode="sequence"]{--bg:#C9EBD3;--ink:#0F2A1B;--plus:#0B6E3A;--plus-hover:#07522B;--no:#C0301E}
  :root[data-mode="solo"]{--bg:#E1D4F6;--ink:#24113D;--plus:#6A2FB8;--plus-hover:#4E1F8C;--no:#C0301E}
  :root[data-mode="create"]{--bg:#F8E7B9;--ink:#3A2A05;--plus:#9A5B00;--plus-hover:#704200;--no:#C0301E}
  :root[data-mode="calculate"]{--bg:#C7DBFB;--ink:#0E1B38;--plus:#1F43B8;--plus-hover:#152F8A;--no:#C0301E}
  body{transition:background-color .5s,color .5s}
  html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
  body{margin:0;height:100%;display:grid;grid-template-columns:minmax(0,1fr) min(19rem,32vw);background:var(--bg);color:var(--ink);font-family:"Fraunces",Georgia,"Times New Roman",serif}
  .stage{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:auto;padding:.8rem 1rem}
  .wrap{margin:auto;display:flex;flex-direction:column;align-items:center;gap:1.2rem;padding:1rem 0;max-width:100%}
  .vals{display:flex;gap:1rem;justify-content:center;min-height:2.6rem;font-size:clamp(1.3rem,3.4vw,2rem);font-weight:600;padding:.4rem 0}
  .chip{display:inline-flex;gap:.3em;padding:.2em .8em;border-radius:999px;background:color-mix(in srgb,var(--ink) 8%,var(--bg))}
  select{font:600 .95rem system-ui,sans-serif;color:var(--ink);background:var(--bg);border:2px solid var(--ink);border-radius:999px;padding:.55em 1em}
  .eqs{display:grid;grid-template-columns:repeat(var(--nc,7),auto);column-gap:.12em;row-gap:.7rem;justify-content:center;font-weight:600;max-width:100%}
  .orig{font-size:clamp(1rem,2.6vw,1.6rem)}
  .top{display:flex;gap:2.2rem;justify-content:center;align-items:flex-start;flex-wrap:wrap}
  .top .vals{flex-direction:column;align-items:flex-start;gap:.5rem;min-height:0;padding:0;font-size:clamp(1rem,2.2vw,1.5rem)}
  .vals:empty{display:none}
  #party{position:fixed;inset:0;z-index:100;pointer-events:none;overflow:hidden}
  .pe{position:absolute;line-height:1;will-change:transform}
  .slay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:1rem;text-transform:uppercase;color:#fff;
    font:900 clamp(2.5rem,11vw,7rem)/1.05 Impact,"Arial Black",system-ui,sans-serif;text-shadow:0 .06em 0 #ff2d95,0 .12em 0 #6a2fb8,0 0 .5em rgba(255,255,255,.6)}
  .chip.grab{cursor:grab;touch-action:none}
  .top .orig{font-size:clamp(.85rem,1.9vw,1.35rem)}
  .work{font-size:clamp(1.5rem,4.6vw,2.8rem)}
  .eqn{display:grid;grid-column:1/-1;grid-template-columns:subgrid;align-items:center;justify-items:end;padding:.3em .5em;border-radius:.4em;
    line-height:1.2;white-space:nowrap;position:relative;background:color-mix(in srgb,var(--ink) 7%,var(--bg));transition:transform .3s}
  .eqn>:nth-child(even){justify-self:center}
  .eqn i{font-style:italic}
  .eqn[data-m]::before{content:attr(data-m);position:absolute;right:100%;margin-right:.35em;top:50%;transform:translateY(-50%);font:700 .7em system-ui,sans-serif;color:var(--plus);white-space:nowrap}
  .co,.var,.eqn>span{display:inline-block}
  .eqn>.opc{cursor:pointer;color:var(--plus);font-weight:800;border-radius:6px;transition:transform .25s,color .25s}
  .eqn>.opc:hover,.eqn>.opc.hl{color:var(--plus-hover);transform:scale(1.5);background:color-mix(in srgb,var(--plus) 20%,transparent)}
  .eqn>.opc.hl{transform:scale(1.9);text-shadow:0 0 .4em var(--plus)}
  .eqn>.hl{background:color-mix(in srgb,var(--plus) 30%,transparent);border-radius:6px;transform:scale(1.3)}
  #modeSel{background:#fff}
  #modeSel option[value=demo]{color:#111}#modeSel option[value=sequence]{color:#1E8A4C}#modeSel option[value=calculate]{color:#2F5BEA}#modeSel option[value=solo]{color:#7B3FBF}#modeSel option[value=create]{color:#B26A00}
  .afield{font:600 1.5rem Georgia,serif;display:inline-flex;gap:.3em;align-items:center}
  .afield input,#crIn{font:600 1.2rem system-ui,sans-serif;color:var(--ink);background:var(--bg);border:2px solid var(--ink);border-radius:12px;padding:.4em .6em}
  .afield input{width:5em}
  #crIn{width:min(24rem,70vw)}
  .panel{display:flex;flex-direction:column;align-items:center;gap:.8rem;margin:1rem auto;font-family:system-ui,sans-serif}
  .panel[hidden]{display:none}
  .ok{color:var(--plus);font-weight:700}.bad{color:var(--no);font-weight:700}
  .grab{cursor:grab;touch-action:none;border-radius:6px}
  .grab:hover{background:color-mix(in srgb,var(--plus) 20%,transparent)}
  .pend{cursor:pointer;border-bottom:2px dashed var(--plus)}
  .drag{z-index:5;position:relative;transition:none;background:var(--bg);box-shadow:0 .3em 1em rgba(0,0,0,.3)}
  .slide{transition:transform 1.1s ease-in-out;z-index:5}
  .drop{outline:3px solid var(--plus)}
  .asking{outline:3px dashed var(--plus)}
  .var.tgt{background:color-mix(in srgb,var(--plus) 35%,transparent);border-radius:6px;transform:scale(1.5)}
  .eq{font:inherit;font-size:1.5em;font-weight:700;line-height:1;color:var(--plus);background:none;border:0;padding:0 .1em;cursor:grab;touch-action:none;transition:transform .25s,color .25s}
  .eq:hover,.eq.target{color:var(--plus-hover);transform:scale(1.5)}
  .eq.target{transform:scale(1.8);text-shadow:0 0 .4em var(--plus)}
  .eq:focus-visible{outline:3px solid var(--plus);outline-offset:4px;border-radius:8px}
  .pop{animation:pop .4s ease-out}
  .shake{animation:shake .6s ease-in-out;color:var(--no)}
  @keyframes pop{from{transform:scale(.8);opacity:.3}to{transform:scale(1);opacity:1}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
  .row{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center}
  .btn{font:600 1rem/1 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:transparent;border:2px solid var(--ink);border-radius:999px;padding:.8em 1.4em;cursor:pointer}
  .btn:hover:not(:disabled){background:var(--ink);color:var(--bg)}
  .btn:disabled{opacity:.4;cursor:default}
  .btn[hidden]{display:none}
  .btn:focus-visible,.link:focus-visible,select:focus-visible{outline:3px solid var(--plus);outline-offset:3px}
  .link{font:600 .85rem system-ui,sans-serif;color:var(--ink);background:none;border:0;cursor:pointer;text-decoration:underline;opacity:.75}
  .chat{display:flex;flex-direction:column;min-height:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    background:color-mix(in srgb,var(--ink) 5%,var(--bg));border-left:2px solid color-mix(in srgb,var(--ink) 18%,transparent)}
  .chat-h{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.8rem 1rem;font-weight:700;border-bottom:2px solid color-mix(in srgb,var(--ink) 12%,transparent)}
  .log{flex:1;min-height:0;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.6rem}
  .msg{align-self:flex-start;max-width:88%;padding:.6rem .85rem;border-radius:14px;font-size:.98rem;line-height:1.4;background:color-mix(in srgb,var(--ink) 11%,var(--bg))}
  .composer{display:flex;flex-direction:column;gap:.4rem;padding:.7rem;border-top:2px solid color-mix(in srgb,var(--ink) 12%,transparent)}
  .composer[hidden],.sheet[hidden]{display:none}
  .composer input{flex:1;min-width:0;padding:.6em .9em;font:600 1.1rem system-ui,sans-serif;color:var(--ink);background:var(--bg);border:2px solid var(--ink);border-radius:999px}
  .composer .btn{padding:.6em 1em}
  .err{min-height:1.1em;color:var(--no);font-size:.85rem}
  .sheet{position:fixed;inset:0;z-index:30;overflow:auto;padding:1.5rem;background:var(--bg);font:1.2rem ui-monospace,Menlo,monospace}
  .sheet section{border-bottom:1px solid color-mix(in srgb,var(--ink) 25%,transparent);padding:.7rem 0}
  .r{display:flex;gap:.8em}
  .r .m{min-width:3.4em;text-align:right;color:var(--plus);font-size:.85em}
  @media (max-width:760px){
    body{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 14rem}
    .chat{border-left:0;border-top:2px solid color-mix(in srgb,var(--ink) 18%,transparent)}
    .work{font-size:clamp(1.3rem,5.6vw,2.4rem)}
  }
  @media (prefers-reduced-motion:reduce){.pop,.shake{animation:none}.eqn,.slide,.eq{transition:none}}
</style>
</head>
<body>
  <div class="stage">
    <header style="display:flex;justify-content:space-between;align-items:center;gap:.6rem"><label class="sr" for="lesson" style="position:absolute;left:-9999px">Lesson</label>
      <span class="row" style="flex-wrap:nowrap"><select id="lesson"><option value="1" selected>One Variable</option><option value="2">2&times;2 systems</option><option value="3">3&times;3 systems</option></select>
      <label class="sr" for="modeSel" style="position:absolute;left:-9999px">Mode</label><select id="modeSel"><option value="demo">Demo</option><option value="sequence">Sequence</option><option value="calculate">Calculate</option><option value="solo">Solo</option><option value="create">Create</option></select></span>
      <span class="row" style="flex-wrap:nowrap">
        <button class="btn" id="hint">Hint</button>
        <button class="btn" id="undo">Undo</button>
        <button class="btn" id="show">Show work</button>
      </span>
    </header>
    <div class="top" id="top"><section class="eqs orig" id="origEl" aria-label="Original equations"></section><section class="eqs orig" id="sysEl" aria-label="Two-variable equations"></section><section class="vals" id="vals" aria-label="Solved values"></section></div>
    <div class="wrap">
      <main class="eqs work" id="wsEl"></main>
      <section class="panel" id="creator" hidden>
        <div id="crT" style="font-weight:700;font-size:1.1rem"></div>
        <div class="row" style="flex-wrap:nowrap"><input id="crIn" autocomplete="off" aria-label="Equation"><button class="btn" id="crAdd">Add</button></div>
        <div class="err" id="crErr"></div>
      </section>
      <section class="panel" id="answer" hidden>
        <div id="ansT" style="font-weight:700">Your answer:</div>
        <select id="ansKind" aria-label="Type of answer"><option value="one">One solution</option><option value="inf">Infinitely many solutions</option><option value="none">No solution</option></select>
        <div class="row" id="ansFields"></div>
        <button class="btn" id="ansGo">Check answer</button>
        <div id="ansMsg" style="min-height:1.4em;font-weight:700"></div>
      </section>
      <div class="row">
        <button class="btn" id="next">Next step</button>
      </div>
    </div>
  </div>

  <aside class="chat" aria-label="Tutor chat">
    <div class="log" id="log" role="log" aria-live="polite"></div>
    <div class="composer" id="ask" hidden>
      <div id="askT" style="font-weight:600"></div>
      <div class="err" id="askErr"></div>
      <div class="row" style="flex-wrap:nowrap">
        <input id="askIn" autocomplete="off" aria-label="Your answer">
        <button class="btn" id="askOk">Send</button>
        <button class="btn" id="askNo" aria-label="Cancel">&#10005;</button>
      </div>
    </div>
  </aside>
  <div class="sheet" id="sheet" hidden><button class="btn" id="sheetX">Close</button><div id="sheetBody"></div></div>

<script>
  var $ = function (id) { return document.getElementById(id); };
  var logEl = $("log");
  var orig = [], ws = [], rows = [], orows = [], srows = [], sys = [], sysV = [], elim = "", elimInfo = null;
  var vals = {}, hist = [], steps = [], ops = 0, locked = false, busy = false, colMin = [];
  var result = null, ansTouched = false, credited = false, lesson = 1, demoN = 0, curDm = 1, pend = null, mode = "demo", demoTimer = null, gen = null, askIdx = 0, askK = 0, askC = null, askKind = "mul", calc = null, hinted = false, mulNote = null;
  var CK = { x: "a", y: "b", z: "e", p: "b", s: "b" };  // p and s are the constant slots before and after x in the one-variable lesson

  var MODES = { demo: "Demo", sequence: "Sequence", calculate: "Calculate", solo: "Solo", create: "Create" };
  var MCOL = { demo: "#111", sequence: "#1E8A4C", calculate: "#2F5BEA", solo: "#7B3FBF", create: "#B26A00" };

  // ---- fractions: {n, d} ----
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = a % b; a = b; b = t; } return a || 1; }
  function mk(n, d) { d = d || 1; if (d < 0) { n = -n; d = -d; } var g = gcd(n, d); return { n: n / g, d: d / g }; }
  function mul(p, q) { return mk(p.n * q.n, p.d * q.d); }
  function add(p, q) { return mk(p.n * q.d + q.n * p.d, p.d * q.d); }
  function inv(p) { return mk(p.d, p.n); }
  function neg(p) { return mk(-p.n, p.d); }
  function ab(p) { return mk(Math.abs(p.n), p.d); }
  function isOne(p) { return p.n === 1 && p.d === 1; }
  function same(p, q) { return p.n === q.n && p.d === q.d; }
  function sg(p) { return (p.n < 0 ? "−" : "") + Math.abs(p.n) + (p.d > 1 ? "/" + p.d : ""); }
  function wrap(p) { return p.n < 0 || p.d > 1 ? "(" + sg(p) + ")" : sg(p); }
  function tm(p, first) {
    var t = isOne(ab(p)) ? "" : (p.d > 1 ? "(" + Math.abs(p.n) + "/" + p.d + ")" : String(Math.abs(p.n)));
    return (first && p.n < 0 ? "−" : "") + t;
  }
  function parse(s) {
    s = s.trim().replace("−", "-");
    var m = s.match(/^(-?\d+)\s*\/\s*(\d+)$/);
    if (m && +m[2]) return mk(+m[1], +m[2]);
    if (/^-?\d+(\.\d+)?$/.test(s)) return mk(Math.round(parseFloat(s) * 1000), 1000);
    return null;
  }

  // ---- typed equations: "6x+9y-z=21", "y=3" ----
  function parseSide(s) {
    var t = s.match(/[+-]?[^+-]+/g), o = { x: mk(0), y: mk(0), z: mk(0), k: mk(0) };
    if (!t || t.join("") !== s) return null;
    for (var j = 0; j < t.length; j++) {
      var ng = t[j].charAt(0) === "-", body = t[j].replace(/^[+-]/, ""), m = body.match(/^(\d+(?:\.\d+)?(?:\/\d+)?)?([xyz])?$/);
      if (!m || (!m[1] && !m[2])) return null;
      var c = m[1] ? parse(m[1]) : mk(1);
      if (!c) return null;
      if (ng) c = neg(c);
      if (m[2]) o[m[2]] = add(o[m[2]], c); else o.k = add(o.k, c);
    }
    return o;
  }
  function parseEq(s) {
    s = String(s).toLowerCase().replace(/−/g, "-").replace(/\s+/g, "");
    var p = s.split("=");
    if (p.length !== 2) return null;
    var L = parseSide(p[0]), R = parseSide(p[1]);
    if (!L || !R || R.x.n || R.y.n || R.z.n || L.k.n) return null;
    return { a: L.x, b: L.y, e: L.z, c: R.k };
  }
  function sameEq(e, w) { return same(e.a, w.a) && same(e.b, w.b) && same(e.e, w.e) && same(e.c, w.c); }

  // ---- problems ----
  // an equation: a x + b y + e z (+ substituted constants in ks) = c
  function rnd(n) { return Math.floor(Math.random() * n); }
  function nz(m) { var v = 0; while (!v) v = rnd(2 * m + 1) - m; return v; }
  function mkEq(a, b, e, c) { return { a: mk(a), b: mk(b), e: mk(e), ks: [], c: mk(c) }; }
  function allV() { return lesson === 3 ? ["x", "y", "z"] : lesson === 1 ? ["x"] : ["x", "y"]; }
  function dv() { return lesson === 1 ? curVs() : allV(); }
  function generate2(level, demo) {
    var m = level ? 7 : 4, sm = level ? 9 : 5, x, y, a1, b1, a2, b2;
    do {
      x = nz(sm); y = nz(sm); a1 = nz(m); b1 = nz(m); a2 = nz(m); b2 = nz(m);
    } while (a1 * b2 - a2 * b1 === 0 || (level && (Math.abs(b1) === Math.abs(b2) || b1 % b2 === 0 || b2 % b1 === 0)) ||
             (demo === 1 && (Math.abs(a1) === Math.abs(a2) || need(a1, a2) !== 1 || need(b1, b2) !== 2)) ||
             (demo === 2 && (need(a1, a2) !== 2 || need(b1, b2) !== 2)));
    return [[a1, b1], [a2, b2]].map(function (p) { return mkEq(p[0], p[1], 0, p[0] * x + p[1] * y); });
  }
  // one variable, two steps: a x + k = c, k before or after the x, sometimes written + (−k)
  function generate1() {
    var a = nz(5), x = nz(9), k = nz(9), form = rnd(3);
    if (Math.abs(a) < 2) a = a < 0 ? -2 : 2;
    if (form === 2 && k > 0) k = -k;
    var q = mkEq(a, 0, 0, a * x + k);
    q.ks = [{ v: form === 1 ? "p" : "s", k: mk(k), pa: form === 2 }];
    return [q];
  }
  // how many solutions: "one", "inf" (infinitely many) or "none" (checked behind the scenes, never shown as a method)
  function rankOf(M) {
    var A = M.map(function (r) { return r.slice(); }), rk = 0;
    for (var c = 0; c < A[0].length && rk < A.length; c++) {
      var pv = -1;
      for (var i = rk; i < A.length; i++) if (A[i][c].n) { pv = i; break; }
      if (pv < 0) continue;
      var t = A[pv]; A[pv] = A[rk]; A[rk] = t;
      for (var r = 0; r < A.length; r++) {
        if (r === rk || !A[r][c].n) continue;
        var f = mul(A[r][c], inv(A[rk][c]));
        A[r] = A[r].map(function (x, j) { return add(x, neg(mul(f, A[rk][j]))); });
      }
      rk++;
    }
    return rk;
  }
  function classify(E) {
    if (lesson === 1) return "one";
    var vs = allV(), M = E.map(function (q) { return vs.map(function (v) { return q[CK[v]]; }); });
    var r1 = rankOf(M), r2 = rankOf(M.map(function (r, i) { return r.concat([E[i].c]); }));
    return r1 === vs.length ? "one" : r2 > r1 ? "none" : "inf";
  }
  // a system with infinitely many solutions or none: one equation is built from the others
  function generateDeg(kind) {
    var d = nz(5);
    if (lesson === 2) {
      var a = nz(4), b = nz(4), c = nz(9), m = [2, 3, -1, -2][rnd(4)];
      return [mkEq(a, b, 0, c), mkEq(a * m, b * m, 0, c * m + (kind === "none" ? d : 0))];
    }
    for (;;) {
      var r1 = [nz(3), nz(3), nz(3), nz(9)], r2 = [nz(3), nz(3), nz(3), nz(9)], p = [1, 2, -1, -2][rnd(4)], q = [1, 2, -1, -2][rnd(4)];
      var r3 = r1.map(function (x, j) { return p * x + q * r2[j]; });
      if (kind === "none") r3[3] += d;
      var E = [r1, r2, r3].map(function (r) { return mkEq(r[0], r[1], r[2], r[3]); });
      if (classify(E) === kind) return E;
    }
  }
  function makeProblem() {
    if (lesson === 1) return generate1();
    var dm = mode === "demo" ? curDm : 0;
    if (!dm && mode !== "create" && Math.random() < 0.2) return generateDeg(Math.random() < 0.5 ? "inf" : "none");
    return lesson === 3 ? generate3(dm) : generate2(0, dm);
  }
  function det3(M) {
    return M[0][0] * (M[1][1] * M[2][2] - M[1][2] * M[2][1]) - M[0][1] * (M[1][0] * M[2][2] - M[1][2] * M[2][0]) + M[0][2] * (M[1][0] * M[2][1] - M[1][1] * M[2][0]);
  }
  // 3x3 step one: equations 1&2 and 1&3 each lose the same variable. Pick the cheapest variable that gives two proper 2-variable equations.
  function bestElim(E) {
    var best = null;
    ["x", "y", "z"].forEach(function (v) {
      var rest = ["x", "y", "z"].filter(function (w) { return w !== v; }), res = [];
      for (var p = 1; p <= 2; p++) {
        var ms = elimMuls(E[0][CK[v]].n, E[p][CK[v]].n), m0 = mk(1), mp = mk(1);
        ms.forEach(function (m) { if (m[0] === 0) m0 = m[1]; else mp = m[1]; });
        res.push({ p: p, ms: ms, u: rest.map(function (w) { return add(mul(E[0][CK[w]], m0), mul(E[p][CK[w]], mp)); }) });

    } else if (k === 4) {     // ground fireworks spitting emojis skyward

    } else if (k === 5) {     // pour a bucket of emojis; they bounce off screen

      var pour = ["😀", "🥳", "🎉", "🏀", "⚽", "🍭", "🎈", "🍩", "⭐", "🧸", "🪙", "🍕"], floor = H - 70;
      for (i = 0; i < 30; i++) {
        var px = 0, py = 0, vx = 260 + rnd(260), vy = -rnd(120), fr4 = [{ transform: "translate(0,0)", offset: 0 }], t = 0, dt = .04, sx = bx0 + 70, sy = by0 + 50;

      }
    } else if (k === 6) {     // hearts multiply from the center into one giant heart
      var S = Math.min(W, H * 1.15) * .42, ps = [], tries = 0;

      }
    } else if (k === 7) {     // swirl of one happy emoji that merges into a giant one
      var hap = ["😀", "🥳", "😎", "🤩", "😂", "🥰", "😁", "🤗"], ch = hap[rnd(hap.length)], N = 36;
      for (i = 0; i < N; i++) {
        var a0 = i / N * 2 * Math.PI, R0 = Math.min(W, H) * (.25 + .3 * (i % 3) / 2), fr5 = [];
        for (q = 0; q <= 40; q++) {
          var u2 = q / 40, ang = a0 + u2 * 9, rr = R0 * (1 - Math.pow(u2, 1.6)) + 5;
          fr5.push({ transform: "translate(" + Math.cos(ang) * rr + "px," + Math.sin(ang) * rr * .8 + "px) rotate(" + u2 * 720 + "deg) scale(" + (1 - .6 * u2) + ")", opacity: u2 > .93 ? 0 : 1 });
        }

      }
      var gs = Math.min(W, H) * .8, ge = em(ch, W / 2 - gs / 2, H / 2 - gs * .55, gs);
      go(ge, [{ transform: "scale(0) rotate(-360deg)", opacity: 0, offset: 0 }, { transform: "scale(0) rotate(-360deg)", opacity: 0, offset: .5 }, { transform: "scale(1.1) rotate(0deg)", opacity: 1, offset: .65 }, { transform: "scale(1) rotate(0deg)", opacity: 1, offset: .75 }, { transform: "scale(1.05) rotate(0deg)", opacity: 1, offset: .88 }, { transform: "scale(1.3) rotate(0deg)", opacity: 0 }], 5000, 0, "ease-out");
    } else {                  // full-screen brain rot
      var words = PH;
      e = document.createElement("div"); e.className = "slay"; e.textContent = words[rnd(words.length)]; P.appendChild(e);
      go(P, [{ background: "rgba(20,10,40,0)" }, { background: "rgba(20,10,40,.8)", offset: .1 }, { background: "rgba(20,10,40,.8)", offset: .85 }, { background: "rgba(20,10,40,0)" }], 5000, 0, "linear");
      if (reduce) go(e, [{ opacity: 0 }, { opacity: 1, offset: .15 }, { opacity: 1, offset: .85 }, { opacity: 0 }], 5000, 0, "linear");
      else {
        go(e, [{ opacity: 0, transform: "scale(.4) rotate(-6deg)" }, { opacity: 1, transform: "scale(1) rotate(2deg)", offset: .12 }, { transform: "scale(1.08) rotate(-2deg)", offset: .3 },
          { transform: "scale(1) rotate(2deg)", offset: .5 }, { transform: "scale(1.08) rotate(-2deg)", offset: .7 }, { opacity: 1, transform: "scale(1) rotate(0)", offset: .85 }, { opacity: 0, transform: "scale(1.25)" }], 5000, 0, "linear");
        var rot = ["🔥", "💅", "✨", "💀", "😭", "🫶", "🗿"];
        for (i = 0; i < 14; i++) go(em(rot[rnd(rot.length)], W * Math.random(), H, 44), [{ transform: "translateY(0) rotate(0)", opacity: 1 }, { transform: "translateY(" + -(H + 100) + "px) rotate(" + (rnd(2) ? 360 : -360) + "deg)", opacity: 1 }], 2600, rnd(2300), "ease-in");
      }

    if (k !== 2 && k !== 3 && !reduce) banner(PH[rnd(PH.length)]);
    partyTimer = setTimeout(stopParty, 5000);
  }
  function tally() {
    celebrate();
    var k = lesson + ":" + mode, nx = NEXTMODE[mode];
    counts[k] = (counts[k] || 0) + 1;
    if (!nx || counts[k] < 2) return;
    var d = say("Nice work! You've finished " + counts[k] + " problems here. Ready for a new challenge? Try " + MODES[nx] + " mode, or keep practicing this one.");
    var b = document.createElement("button"); b.className = "link"; b.textContent = "Switch to " + MODES[nx];
    b.addEventListener("click", function () { setMode(nx); });
    d.appendChild(document.createElement("br")); d.appendChild(b);
  }
  function onSolved() {
    var nx = $("next"); nx.textContent = "Finished! Another?";
    nx.hidden = false; nx.disabled = false; if (mode !== "demo") nx.focus();
    tally();
  }
  var useCustom = null;
  function ints(E) { return E.every(function (q) { return allV().every(function (v) { return q[CK[v]].d === 1; }); }); }
  // can the demo walk through this system? (whole-number coefficients, and no zero coefficients to eliminate)
  function demoOK(E) {
    if (!ints(E)) return false;
    return lesson === 1 ? !!E[0].a.n : lesson === 3 ? !!bestElim(E) : E.every(function (q) { return q.a.n && q.b.n; });
  }
  function setMode(m) {
    var sel = $("modeSel");
    // equations typed in Create carry over to the mode the student picks
    if (mode === "create" && m !== "create" && orig.length === allV().length) {
      if (m === "demo" && !demoOK(orig)) { sel.value = "create"; note("The demo can't walk through this one: a coefficient is zero or not a whole number. Try Calculate or Sequence."); return; }
      useCustom = JSON.parse(JSON.stringify(orig));
    }
    mode = m; document.documentElement.dataset.mode = m;
    sel.value = m; sel.style.color = MCOL[m];
    newProblem();
  }

  function newProblem() {
    calc = null; hinted = false; mulNote = null; pend = null; stopParty(); stopDemo(); closeAsk(false); busy = false;
    var plain = mode === "solo" || mode === "create";
    if (mode === "demo") { curDm = demoN % 2 + 1; demoN++; }
    if (mode === "create") orig = [];
    else if (useCustom) { orig = useCustom; useCustom = null; }
    else orig = makeProblem();
    ws = JSON.parse(JSON.stringify(orig));
    sys = []; sysV = []; elim = ""; elimInfo = lesson === 3 && orig.length === 3 && ints(orig) ? bestElim(orig) : null;
    hist = []; ops = 0; vals = {}; result = null; locked = false; colMin = [];
    steps = [{ eqs: orig.map(function (q) { return fmt(q, dv()); }) }];
    logEl.innerHTML = "";
    var nx = $("next"); nx.disabled = false; nx.hidden = mode !== "demo"; nx.textContent = "Next step";
    $("hint").hidden = plain; $("hint").textContent = mode === "demo" ? "Explain" : "Hint"; updUndo();
    $("top").style.display = plain ? "none" : ""; $("vals").style.display = plain ? "none" : "";
    var building = mode === "create" && orig.length < allV().length;
    $("creator").hidden = !building; $("answer").hidden = !plain || building;
    render(-1); head();
    if (mode === "demo") peekNext();
    if (plain) buildAnswer();
    if (mode === "solo") note("Work this out on your own, then type your answer.");
    if (building) crPrompt();

  // ---- solo and create: no help, just the problem and an answer ----
  function dt2(a, b, c, d) { return add(mul(a, d), neg(mul(b, c))); }
  function dt3(M) {
    return add(add(mul(M[0][0], dt2(M[1][1], M[1][2], M[2][1], M[2][2])), neg(mul(M[0][1], dt2(M[1][0], M[1][2], M[2][0], M[2][2])))), mul(M[0][2], dt2(M[1][0], M[1][1], M[2][0], M[2][1])));
  }
  // the unique solution (as fractions, in x, y, z order), or null
  function solveSys(E) {
    if (lesson === 1) { var q1 = E[0], kk = q1.ks.reduce(function (t, k) { return add(t, k.k); }, mk(0)); return q1.a.n ? [mul(add(q1.c, neg(kk)), inv(q1.a))] : null; }
    var vs = allV(), M = E.map(function (q) { return vs.map(function (v) { return q[CK[v]]; }); });

    if (!D.n) return null;
    return vs.map(function (v, j) { return mul(dd(M.map(function (r, i) { var r2 = r.slice(); r2[j] = E[i].c; return r2; })), inv(D)); });
  }
  function buildAnswer() {
    $("ansFields").innerHTML = allV().map(function (v) { return "<label class=\"afield\"><i>" + v + "</i> = <input id=\"ans_" + v + "\" autocomplete=\"off\" aria-label=\"" + v + "\"></label>"; }).join("");
    $("ansKind").value = "one"; $("ansKind").hidden = lesson === 1; $("ansFields").hidden = false;
    $("ansMsg").textContent = ""; $("ansMsg").className = ""; ansTouched = false; credited = false;
  }
  function checkAnswer() {
    var cl = classify(orig), kind = lesson === 1 ? "one" : $("ansKind").value, ok = false, miss = false, m = $("ansMsg");
    ansTouched = true; updUndo();
    if (kind !== "one") ok = kind === cl;
    else if (cl === "one") {
      var sol = solveSys(orig); ok = true;
      allV().forEach(function (v, j) { var t = parse($("ans_" + v).value); if (!t) miss = true; else if (!same(t, sol[j])) ok = false; });
    }
    if (miss) { m.className = "bad"; m.textContent = "Enter a number for each variable, like 3, -2 or 1/2."; return; }
    if (!ok) { m.className = "bad"; m.textContent = "Not quite. Check your work and try again."; return; }

  // an equation as written in a book: variables and numbers on either side, collected into a x + b y + e z = c
  function parseOne(s) {
    var pa = /\(/.test(s), t = s.replace(/[()]/g, "").replace(/\+-/g, "-").replace(/--/g, "+"), p = t.split("=");
    var bad = "Write it with x on the left and a number on the right, like 3x-2=10.";
    if (p.length !== 2 || !p[0] || !p[1]) return bad;
    var L = parseSide(p[0]), R = parse(p[1]), first = (p[0].match(/[+-]?[^+-]+/) || [""])[0];
    if (!L || !R || L.y.n || L.z.n || !L.x.n) return bad;

    if (L.k.n) { var pre = !/x/.test(first); q.ks = [{ v: pre ? "p" : "s", k: L.k, pa: pa && !pre && L.k.n < 0 }]; }
    return q;
  }
  function parseAny(s) {
    s = String(s).toLowerCase().replace(/−/g, "-").replace(/[\s*·⋅]/g, "");
    if (lesson === 1) return parseOne(s);
    var p = s.split("=");
    if (p.length !== 2 || !p[0] || !p[1]) return "Type an equation with one = sign, like " + (lesson === 3 ? "2x+3y-z=12." : "2x+3y=12.");
    var L = parseSide(p[0]), R = parseSide(p[1]);

    var q = { a: add(L.x, neg(R.x)), b: add(L.y, neg(R.y)), e: add(L.z, neg(R.z)), ks: [], c: add(R.k, neg(L.k)) };

  }
  function crPrompt() {
    $("crT").textContent = (lesson === 1 ? "Type your equation" : "Equation " + (orig.length + 1) + " of " + allV().length) + ": type it the way it's written, like " + (lesson === 3 ? "2x+3y-z=12" : lesson === 1 ? "3x-2=10" : "2x+3y=12");

    $("creator").hidden = true; $("answer").hidden = false; buildAnswer();

  }

  // the demo button names the step it is about to do

  // why the next step makes sense (the demo's Explain button)
  function explain(s) {
    var t = s[0], q = ws[s[1]], k = q && q.ks[s[2]];
    if (t === "show") return "We want one variable to cancel when we add the equations. Multiplying equation " + (s[1] + 1) + " by " + wrap(s[2]) + " makes its coefficient the opposite of the matching coefficient in the other equation.";
    if (t === "mul") return "Multiply every term, on both sides of the equation, so it stays balanced.";
    if (t === "add") return "One variable now has opposite coefficients, so adding the two equations makes it disappear. That leaves a simpler equation.";
    if (t === "coef") return "The variable is being multiplied by a number. Dividing both sides by that number undoes the multiplication and leaves the variable by itself. Whatever we do to one side, we do to the other.";
    if (t === "const") return k && k.k.n < 0
      ? "There is a negative number, " + sg(k.k) + ", on the variable's side. Adding " + sg(ab(k.k)) + " to both sides cancels it, because adding the opposite makes 0."

    if (t === "calc") return "Now do the arithmetic to turn it into a single number.";
    if (t === "comb") return "Two plain numbers sit side by side, so we can combine them into one number. That is called combining like terms.";
    if (t === "simp") return "Putting a value in for a variable made a multiplication" + (k ? ", " + kview(q, k, curVs()).prompt : "") + ". Multiplying gives a single number.";
    return "We found " + s[1] + " = " + (vals[s[1]] ? sg(vals[s[1]]) : "a number") + ". Putting that value in place of " + s[1] + " in an equation leaves one fewer unknown, so we can solve for the next variable.";
  }

    var t = s[0], q = ws[s[1]];

    if (t === "add") return "Add equations";
    if (t === "coef") return "Divide both sides";
    if (t === "const") return q && q.ks[s[2]] && q.ks[s[2]].k.n < 0 ? "Add to both sides" : "Subtract from both sides";
    if (t === "comb") return "Combine like terms";
    if (t === "calc") return "Calculate " + (q ? q.raw : "");
    if (t === "simp") return q && q.ks[s[2]] ? "Calculate " + kview(q, q.ks[s[2]], curVs()).prompt : "Calculate";
    return "Substitute " + s[1];
  }

  $("lesson").addEventListener("change", function () { lesson = +this.value; if (mode === "create") orig = []; useCustom = null; setMode("demo"); });
  $("crAdd").addEventListener("click", crAdd);

    if (e.key !== "Escape") return;

  setMode("demo");
